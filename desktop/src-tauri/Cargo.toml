[package]
name = "smartschool-desktop"
version = "0.1.0"
description = "SmartSchool SN — wrapper desktop Windows"
authors = ["SmartSchool SN"]
license = "MIT"
repository = "https://github.com/medardsellou10-source/smartschool-sn"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "smartschool_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
